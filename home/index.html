<!DOCTYPE html>
<html lang="bn">
<head>
<script src="../shared/theme.js"></script>
<script src="../shared/fallback.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MOI — Home</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css">
<link rel="stylesheet" href="home.css">
<link rel="stylesheet" href="../shared/theme.css">
<link rel="stylesheet" href="../shared/features.css">
</head>
<body>

<div class="demo-flag"><i class="fa-solid fa-flask"></i> DEMO MODE</div>

<div class="app-container">

  <div class="top-bar">
    <div class="profile-wrap">
      <div class="avatar-ring"><img id="userAvatar" src="" alt="profile"></div>
      <div class="greet">
        <span class="name" id="userNameDisplay">Loading…</span>
        <span class="uid" id="userDisplayId">ID: ---</span>
        <span class="lvl-row"><span class="lvl-chip" id="lvlChip">Lv 1</span><button class="dia-pill" id="diaPill" title="Wallet">💎 <b id="diaVal">0</b></button></span>
      </div>
    </div>
    <div class="head-actions">
      <button class="icon-btn" id="searchToggle" title="Search"><i class="fa-solid fa-magnifying-glass"></i></button>
      <button class="icon-btn" id="bellBtn" title="Notifications"><i class="fa-regular fa-bell"></i></button>
    </div>
  </div>

  <div class="search-slide" id="searchSlide">
    <div class="search-bar">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="hotSearchInput" placeholder="নাম বা দেশ খুঁজুন...">
      <i class="fa-solid fa-xmark clear-x" id="hotClearSearch"></i>
    </div>
  </div>

  <div class="banner-container">
    <div class="room-banner" id="roomBanner" role="link" tabindex="0">
      <div class="room-avatar-wrap">
        <div class="room-avatar-glow"></div>
        <img class="room-avatar" id="roomAvatar" src="" alt="room">
        <span class="room-live-badge" id="roomLiveBadge" style="display:none">LIVE</span>
      </div>
      <div class="room-banner-info">
        <div class="room-name" id="bannerTitle">Loading…</div>
        <div class="room-meta">
          <span class="room-country" id="bannerCountry"><i class="fa-solid fa-globe"></i> <span>Country</span></span>
          <span class="room-level" id="roomLevel">L.0</span>
          <span class="room-uid-badge" id="bannerUid"><i class="fa-solid fa-hashtag"></i> ---</span>
        </div>
      </div>
      <button class="room-action-btn" id="mineBtn">
        <i class="fa-solid fa-plus"></i>
        <span>CREATE</span>
      </button>
    </div>
  </div>


  <div class="quick-row" id="quickRow">
    <button class="qa" onclick="MOI.openCheckin()"><span class="qa-ic qa-a"><i class="fa-solid fa-calendar-check"></i><em class="qa-dot" id="dotCheckin"></em></span><span>Check-in</span></button>
    <button class="qa" onclick="MOI.openSpin()"><span class="qa-ic qa-b"><i class="fa-solid fa-dharmachakra"></i><em class="qa-dot" id="dotSpin"></em></span><span>Lucky Spin</span></button>
    <button class="qa" onclick="MOI.openLeaderboard()"><span class="qa-ic qa-c"><i class="fa-solid fa-ranking-star"></i></span><span>Ranking</span></button>
    <button class="qa" onclick="MOI.openStore()"><span class="qa-ic qa-d"><i class="fa-solid fa-store"></i></span><span>Store</span></button>
    <button class="qa" onclick="MOI.openBadges()"><span class="qa-ic qa-e"><i class="fa-solid fa-medal"></i></span><span>Badges</span></button>
  </div>

  <div class="section-header">
    <div class="section-top-row">
      <span class="section-title"><span class="fire">🔥</span> Hot Rooms</span>
      <button class="action-chip" id="followingBtn"><i class="fa-solid fa-star"></i> Following</button>
    </div>
    <div class="live-stats" id="liveStats"></div>
    <div class="cat-row" id="catRow">
      <button class="cat on" data-cat="all">All</button>
      <button class="cat" data-cat="music"><i class="fa-solid fa-music"></i> Music</button>
      <button class="cat" data-cat="chat"><i class="fa-solid fa-comments"></i> Chat</button>
      <button class="cat" data-cat="party"><i class="fa-solid fa-champagne-glasses"></i> Party</button>
      <button class="cat" data-cat="new"><i class="fa-solid fa-sparkles"></i> New</button>
    </div>
    <div class="country-row">
      <div class="country-selector-wrap">
        <span class="flag-preview" id="flagPreview">🌍</span>
        <select id="countryFilter">
          <option value="all">All Countries</option>
          <option value="Bangladesh">Bangladesh</option>
          <option value="India">India</option>
          <option value="Pakistan">Pakistan</option>
          <option value="Nepal">Nepal</option>
          <option value="Sri Lanka">Sri Lanka</option>
          <option value="UAE">UAE</option>
          <option value="Saudi Arabia">Saudi Arabia</option>
          <option value="Malaysia">Malaysia</option>
          <option value="Singapore">Singapore</option>
          <option value="UK">UK</option>
          <option value="USA">USA</option>
          <option value="Canada">Canada</option>
          <option value="Australia">Australia</option>
          <option value="Japan">Japan</option>
          <option value="South Korea">South Korea</option>
          <option value="China">China</option>
          <option value="Russia">Russia</option>
          <option value="France">France</option>
          <option value="Germany">Germany</option>
          <option value="Italy">Italy</option>
        </select>
        <i class="fa-solid fa-chevron-down chev"></i>
      </div>
      <button class="clear-filter-btn" id="clearFilterBtn" title="Clear filter"><i class="fa-solid fa-xmark"></i></button>
    </div>
  </div>

  <div class="grid-container" id="hotGrid"></div>

</div>

<div id="chatOverlay">
  <div class="chat-topbar">
    <div class="ct-back" onclick="closeChat()"><i class="fa-solid fa-arrow-left"></i></div>
    <div class="ct-title">Chat<div class="ct-sub">বন্ধুদের সাথে কথা বলুন</div></div>
  </div>
  <div class="chat-loading" id="chatLoading">
    <div class="chat-spinner"></div>
    <div>Chat লোড হচ্ছে...</div>
  </div>
  <iframe id="chatFrame" allow="microphone;camera;clipboard-read;clipboard-write;autoplay;fullscreen"></iframe>
</div>

<nav class="bottom-nav">
  <a href="javascript:void(0)" class="nav-item active" id="navRoom">
    <span class="nav-icon"><i class="fa-solid fa-house"></i></span><span>Room</span>
  </a>
  <a href="javascript:void(0)" class="nav-item" id="navChat">
    <span class="nav-icon"><i class="fa-solid fa-comment-dots"></i><em class="badge" id="chatBadge">0</em></span><span>Messages</span>
  </a>
  <a href="javascript:void(0)" class="nav-item" id="navMe">
    <span class="nav-icon"><i class="fa-regular fa-user"></i></span><span>Me</span>
  </a>
</nav>

<div class="modal-overlay" id="roomModal">
  <div class="modal-card">
    <h3><i class="fa-solid fa-sliders"></i> Customize Room</h3>
    <label style="text-align:center;">Profile Image</label>
    <div class="upload-box" id="uploadBox">
      <i class="fa-solid fa-plus"></i>
      <img id="croppedPreview" src="" alt="preview">
      <input type="file" id="modalImgInput" accept="image/*" hidden>
    </div>
    <label>Group Name</label>
    <input type="text" id="modalGroupName" placeholder="e.g., 24 HOUR FM">
    <label>Country</label>
    <select id="modalCountry">
      <option value="">Select Country</option>
      <option value="Bangladesh">🇧🇩 Bangladesh</option>
      <option value="India">🇮🇳 India</option>
      <option value="Pakistan">🇵🇰 Pakistan</option>
      <option value="Nepal">🇳🇵 Nepal</option>
      <option value="Sri Lanka">🇱🇰 Sri Lanka</option>
      <option value="UAE">🇦🇪 UAE</option>
      <option value="Saudi Arabia">🇸🇦 Saudi Arabia</option>
      <option value="Malaysia">🇲🇾 Malaysia</option>
      <option value="Singapore">🇸🇬 Singapore</option>
      <option value="UK">🇬🇧 UK</option>
      <option value="USA">🇺🇸 USA</option>
      <option value="Canada">🇨🇦 Canada</option>
      <option value="Australia">🇦🇺 Australia</option>
      <option value="Japan">🇯🇵 Japan</option>
      <option value="South Korea">🇰🇷 South Korea</option>
      <option value="China">🇨🇳 China</option>
      <option value="Russia">🇷🇺 Russia</option>
      <option value="France">🇫🇷 France</option>
      <option value="Germany">🇩🇪 Germany</option>
      <option value="Italy">🇮🇹 Italy</option>
    </select>
    <label>Room UID</label>
    <input type="text" id="modalRoomUid" readonly>
    <div class="modal-btn-group">
      <button class="modal-btn cancel" id="modalCloseBtn">Cancel</button>
      <button class="modal-btn submit" id="modalSubmitBtn">Submit & Go</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="cropperModal">
  <div class="modal-card">
    <h3><i class="fa-solid fa-crop"></i> Crop Image</h3>
    <div style="max-height:300px;overflow:hidden;border-radius:12px;background:#000">
      <img id="cropperImage" src="" alt="To Crop">
    </div>
    <div class="modal-btn-group">
      <button class="modal-btn cancel" id="cropCancelBtn">Cancel</button>
      <button class="modal-btn submit" id="cropSaveBtn">Crop & Save</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-functions-compat.js"></script>
<script src="../shared/config.js"></script>
<script src="../shared/core/firebase-init.js"></script>
<script src="../shared/core/sync.js"></script>
<script src="../shared/core/sync-routes.js"></script>
<script src="../shared/storage.js"></script>
<script src="../shared/core/economy.js"></script>
<script src="../shared/core/db-storage.js"></script>
<script src="../shared/core/auth.js"></script>
<script src="../shared/features.js"></script>
<script src="rooms.js"></script>
<script src="banner.js"></script>
<script src="modal.js"></script>
<script src="home.js"></script>
</body>
</html>
